name: Fehlende Ausstattung ergänzen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-missing-equipment:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fehlende Ausstattung ergänzen
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("ausstattung.html")
          text = path.read_text(encoding="utf-8")

          marker = "// system_missing_equipment_migration_20260817"

          migration = r'''// system_missing_equipment_migration_20260817
          async function migrateMissingEquipment(){
            const version="2026-08-17-missing-v1";

            try{
              const markerSnap=await get(
                ref(
                  db,
                  dbPath("assetMeta/missingEquipmentVersion")
                )
              );

              if(markerSnap.val()===version)return;

              const current=(
                await get(
                  ref(
                    db,
                    dbPath("assets")
                  )
                )
              ).val()||{};

              const patch={};
              const now=Date.now();

              const add=(key,row)=>{
                if(current[key])return;

                patch[`assets/${key}`]={
                  ...row,
                  seeded:true,
                  ts:now,
                  updatedAt:now,
                  updatedBy:"Ausstattungsplan 17.08.2026"
                };
              };

              add("brandschutz",{
                area:"Sicherheit",
                item:"Brandschutz für Grill und Feuerschale",
                type:"Kaufen",
                status:"Zu kaufen",
                source:"Baumarkt / Fachhandel",
                qty:"1 Set",
                planned:70,
                actual:0,
                due:"",
                next:"Geeigneten Feuerlöscher bzw. Löschmittel, Löschdecke sowie Löschwasser oder Sand fest einplanen",
                note:"Unmittelbar bei Grill und Feuerschale verfügbar halten; Abstand zu Stroh, Jute und Holzdeko beachten."
              });

              add("erstehilfe",{
                area:"Sicherheit",
                item:"Erste-Hilfe-Set für das Event",
                type:"Kaufen",
                status:"Zu kaufen",
                source:"Apotheke / Baumarkt",
                qty:"1 Set",
                planned:30,
                actual:0,
                due:"",
                next:"Vollständigen Verbandskasten plus Kühlpacks und kleine Wundversorgung zusammenstellen",
                note:"Gut sichtbar und schnell erreichbar lagern; besonders wegen Wettkämpfen und Feuerstelle."
              });

              add("grillwerkzeug",{
                area:"Essen & Feuer",
                item:"Grill- und Küchenwerkzeug",
                type:"Kaufen",
                status:"Zu kaufen",
                source:"Eigenbestand prüfen / Baumarkt",
                qty:"1 Set",
                planned:50,
                actual:0,
                due:"",
                next:"Eigenbestand prüfen und fehlende Teile ergänzen",
                note:"Grillzangen, hitzefeste Handschuhe, Messer, Schneidebretter, Servierschüsseln, große Löffel und Küchenrolle einplanen."
              });

              add("wasserlogistik",{
                area:"Logistik",
                item:"Wasserkanister und Wasserlogistik",
                type:"Kaufen",
                status:"Offene Entscheidung",
                source:"noch offen",
                qty:"1-2 große Kanister",
                planned:40,
                actual:0,
                due:"",
                next:"Kanistergröße und Wasserquelle mit Hygiene-, Küchen- und Brandschutzplanung abstimmen",
                note:"Zusätzlich zum Trinkwasser Reserve für Händewaschen, Reinigung und bei Bedarf Löschen vorsehen."
              });

              add("lagerboxen",{
                area:"Logistik",
                item:"Wetterfeste Aufbewahrungsboxen",
                type:"Kaufen",
                status:"Zu kaufen",
                source:"IKEA / Baumarkt",
                qty:"2-4 Boxen",
                planned:50,
                actual:0,
                due:"",
                next:"Vorhandene Boxen prüfen und fehlende Größen ergänzen",
                note:"Für Lebensmittel, Werkzeug, Alchemie-Material und feuchtigkeitsempfindliche Ausstattung; Schutz vor Tau und Schmutz."
              });

              add("reparaturkoffer",{
                area:"Logistik",
                item:"Aufbau- und Reparaturkoffer",
                type:"Kaufen",
                status:"Zu kaufen",
                source:"Baumarkt / Eigenbestand",
                qty:"1 Kiste",
                planned:60,
                actual:0,
                due:"",
                next:"Eigenbestand sammeln und fehlendes Verbrauchsmaterial ergänzen",
                note:"Kabelbinder, Gewebeband, Schnur, Ersatzseil, Hammer bzw. Vorschlaghammer, Arbeitshandschuhe, Taschenlampe und Ersatzbatterien/Akkus."
              });

              add("beschilderung",{
                area:"Gelände",
                item:"Beschilderung für Gelände und Stationen",
                type:"DIY",
                status:"Zu basteln",
                source:"Eigenbau",
                qty:"mehrere Schilder",
                planned:25,
                actual:0,
                due:"",
                next:"Schilderliste nach finalem Lageplan festlegen und gestalten",
                note:"Mindestens Toilette, Getränke, Wettkampfbereiche und Eingang; Parkplatz nur falls vor Ort nötig."
              });

              patch[
                "assetMeta/missingEquipmentVersion"
              ]=version;

              patch[
                "assetMeta/missingEquipmentUpdatedAt"
              ]=now;

              await update(
                ref(
                  db,
                  dbPath("")
                ),
                patch
              );

            }catch(error){
              console.error(
                "Migration fehlender Ausstattung fehlgeschlagen",
                error
              );

              sync(
                "Ausstattungs-Migration fehlgeschlagen",
                "err"
              );
            }
          }

          '''

          if marker not in text:
              anchor = "async function selfLink(){"

              if anchor not in text:
                  raise SystemExit(
                      "FEHLER: selfLink() nicht gefunden"
                  )

              text = text.replace(
                  anchor,
                  migration + anchor,
                  1
              )

              print("OK Migration ergänzt")

          else:
              print("OK Migration bereits vorhanden")

          if "await migrateMissingEquipment();" not in text:
              old = """await migrateCostPlan();
          await selfLink();"""

              new = """await migrateCostPlan();
          await migrateMissingEquipment();
          await selfLink();"""

              if old not in text:
                  raise SystemExit(
                      "FEHLER: Startanker nicht gefunden"
                  )

              text = text.replace(
                  old,
                  new,
                  1
              )

              print("OK Startaufruf ergänzt")

          else:
              print("OK Startaufruf bereits vorhanden")

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

      - name: Änderungen prüfen
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          grep -q 'system_missing_equipment_migration_20260817' ausstattung.html
          grep -q 'Brandschutz für Grill und Feuerschale' ausstattung.html
          grep -q 'Erste-Hilfe-Set für das Event' ausstattung.html
          grep -q 'Grill- und Küchenwerkzeug' ausstattung.html
          grep -q 'Wasserkanister und Wasserlogistik' ausstattung.html
          grep -q 'Wetterfeste Aufbewahrungsboxen' ausstattung.html
          grep -q 'Aufbau- und Reparaturkoffer' ausstattung.html
          grep -q 'Beschilderung für Gelände und Stationen' ausstattung.html
          grep -q 'await migrateMissingEquipment();' ausstattung.html

      - name: Änderungen committen
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- ausstattung.html; then
            echo "Keine Änderungen notwendig."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ausstattung.html
          git commit -m "Add missing event equipment"
          git push
