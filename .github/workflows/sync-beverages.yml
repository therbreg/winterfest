name: Getränke mit Firebase synchronisieren
on:
  push:
    branches: [main]
    paths: [data/beverages.json, .github/workflows/sync-beverages.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Google-Authentifizierungsbibliothek installieren
        run: python3 -m pip install --disable-pip-version-check --quiet google-auth
      - name: Validieren und feldweise mergen
        env:
          EVENT_ID: ${{ secrets.WINTERFEST_EVENT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          from pathlib import Path
          c=json.loads(Path("data/beverages.json").read_text())
          eid=os.environ.get("EVENT_ID","").strip()
          if not eid: raise SystemExit("WINTERFEST_EVENT_ID fehlt oder ist leer.")
          service_account_json=os.environ.get("FIREBASE_SERVICE_ACCOUNT_JSON","").strip()
          if not service_account_json: raise SystemExit("FIREBASE_SERVICE_ACCOUNT_JSON fehlt oder ist leer.")
          try:
            service_account_info=json.loads(service_account_json)
            credentials=service_account.Credentials.from_service_account_info(service_account_info,scopes=["https://www.googleapis.com/auth/userinfo.email","https://www.googleapis.com/auth/firebase.database"])
            credentials.refresh(Request())
          except Exception as exc:
            raise SystemExit(f"Firebase-Servicekonto konnte nicht authentifiziert werden: {type(exc).__name__}")
          headers={"Authorization":"Bearer "+credentials.token}
          if c["recipeStatus"]!="Rezepttest ausstehend" or not c["alchemyStation"]["alcoholFree"] or not c["alchemyStation"]["vegan"]: raise SystemExit("Ungültige Konfiguration.")
          root="https://winterfest30-default-rtdb.europe-west1.firebasedatabase.app/events/"+eid
          with urllib.request.urlopen(urllib.request.Request(root+"/shopping.json",headers=headers),timeout=30) as r: old=json.load(r) or {}
          now=int(time.time()*1000);patch={};fields=("item","qty","category","note")
          for key,plan in c["shopping"].items():
            if isinstance(old.get(key),dict):
              for f in fields: patch[f"shopping/{key}/{f}"]=plan[f]
              patch[f"shopping/{key}/planningUpdatedAt"]=now
            else: patch[f"shopping/{key}"]={**plan,"responsible":"","bought":False,"by":"GitHub Actions","ts":now}
          for key in c["legacyShoppingKeys"]:
            if not isinstance(old.get(key),dict): continue
            archive=dict(old[key]);archive.update({"sourceKey":key,"archivedAt":now,"archivedReason":"Durch finales Getränkekonzept ersetzt"})
            patch[f"shoppingArchive/beverageConcept/{key}"]=archive;patch[f"shopping/{key}"]=None
          patch["meta/beveragePlanVersion"]=c["schemaVersion"];patch["meta/beveragePlanUpdatedAt"]=now
          req=urllib.request.Request(root+".json",data=json.dumps(patch,ensure_ascii=False).encode(),method="PATCH",headers={**headers,"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as r:r.read();print("Firebase:",r.status)
          PY
