name: Deko-Plan auf Website anwenden

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-deko-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deko-Aufgaben und Einkaufsposten einbauen
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          marker = "const PHASES_DATA = "
          start = text.index(marker) + len(marker)
          end = text.index(" ;\n</script>", start)

          phases = json.loads(text[start:end])

          def phase(phase_id):
              return next(p for p in phases if p["id"] == phase_id)

          def upsert_category(phase_id, title, tasks):
              p = phase(phase_id)
              existing = next((c for c in p.get("categories", []) if c.get("title") == title), None)
              payload = {"title": title, "tasks": tasks}
              if existing:
                  existing.clear()
                  existing.update(payload)
              else:
                  p.setdefault("categories", []).append(payload)

          upsert_category(
              "phase1",
              "🎨 Deko · Test & Freigabe",
              [
                  {"id":"deko_sep_bestand","prio":"prio-2","text":"Deko-Bestand festhalten: 8 Laternen und bereits gekaufte LED-Kerzen als vorhanden markieren; vorerst keine weiteren Laternen kaufen"},
                  {"id":"deko_sep_testmaterial","prio":"prio-2","text":"Bis Mitte September nur Testmaterial beschaffen: ca. 1 m Naturstoff/Molton, ca. 1 m Bordeaux, Juteschnur und bei Bedarf 1 Holzlatte; noch keine Großbestellung"},
                  {"id":"deko_sep_prototyp","prio":"prio-1","text":"Aus Testmaterial einen Muster-Wimpel, ein kleines Banner bzw. Schabrackenstück und eine kleine Deko-Szene mit Laterne bauen; prüfen, ob Farben und Material ausreichend handgemacht und mittelalterlich wirken"},
                  {"id":"deko_sep_mengenplan","prio":"prio-1","text":"Bis Ende September Deko-Mengen anhand des Gelände- und Zeltplans festlegen: Stoffflächen, Wimpellänge, Bannerzahl, Pfosten, Seillänge, Schilder, Alchemistenstation und Lichtpunkte"},
                  {"id":"deko_sep_kauffreigabe","prio":"prio-2","text":"Erst nach bestandenem Prototyp die Großbeschaffung freigeben; bei falscher Farbe oder zu künstlicher Wirkung Material ändern statt größere Mengen nachzukaufen"}
              ]
          )

          p2 = phase("phase2")
          p2["subtitle"] = "Oktober – Dezember 2026"

          upsert_category(
              "phase2",
              "🎨 Deko · Hauptbeschaffung & Produktion",
              [
                  {"id":"deko_oct_stoff","prio":"prio-1","text":"Im Oktober nach Prototyp-Freigabe Hauptmenge Stoff bestellen; Richtwert ca. 6 m Natur-Dekomolton und 2 m Weinrot bei 3 m Warenbreite, Menge nach finalem Aufmaß korrigieren"},
                  {"id":"deko_oct_wimpel","prio":"prio-2","text":"Wimpelketten aus Stoffresten selbst herstellen statt fertig kaufen; Ziel ca. 30 bis 50 m für Eingang, Festfläche und Wettkampfbereich"},
                  {"id":"deko_oct_banner","prio":"prio-2","text":"4 bis 6 DIY-Banner im einheitlichen Winterfest-Stil herstellen; gekaufte Fantasy-Banner nur ergänzend und nur wenn optisch wirklich passend"},
                  {"id":"deko_nov_seile","prio":"prio-2","text":"Jute- und Sisalseil beschaffen: dünne Juteschnur für Wimpel, Schilder und Kleinteile; stärkeres Sisalseil für die optische Geländeabgrenzung"},
                  {"id":"deko_nov_pfosten","prio":"prio-2","text":"Nach finaler Geländeabgrenzung etwa 12 bis 16 einfache Fichtenlatten/Pfosten bei OBI oder vergleichbar beschaffen; keine Stückzahl kaufen, bevor der Lageplan feststeht"},
                  {"id":"deko_nov_schilder","prio":"prio-2","text":"Holzreste für Eingangsschild, Wettkampfschilder, Getränkeschilder und Questbereich sammeln bzw. günstig beschaffen und ein einheitliches Beschriftungsdesign umsetzen"},
                  {"id":"deko_nov_alchemie","prio":"prio-3","text":"Alchemistenstation gezielt ergänzen: nur wenige Korkgläser/Fläschchen, Beschriftungen und kleine Requisiten beschaffen; keine große Sammlung zufälliger Kleindeko"},
                  {"id":"deko_nov_licht","prio":"prio-3","text":"Vorhandene Laternen und LED-Kerzen auf alle Bereiche verteilen; zusätzliche LED-Kerzen nur für konkret festgestellte Lichtlücken kaufen"},
                  {"id":"deko_nov_inventur","prio":"prio-1","text":"Bis Ende November komplette Deko-Inventur gegen den Geländeplan durchführen und offene Fehlteile dokumentieren"},
                  {"id":"deko_dec_online","prio":"prio-1","text":"Bis spätestens 15. Dezember alle zwingend benötigten nicht-lokalen Dekoartikel bestellen; danach nur noch lokal verfügbare Ergänzungen einplanen"}
              ]
          )

          upsert_category(
              "phase3",
              "🎨 Deko · Abschluss vor dem Fest",
              [
                  {"id":"deko_jan_finish","prio":"prio-1","text":"Alle DIY-Arbeiten an Bannern, Wimpeln, Schabracken und Schildern spätestens eine Woche vor dem Event vollständig abschließen"},
                  {"id":"deko_jan_probelayout","prio":"prio-1","text":"Vor dem Event einmal die wichtigsten Dekobereiche probeweise zusammenstellen: Eingang, Hauptzelt/Tische, Alchemistenstation, Questbereich und Fotopunkt"},
                  {"id":"deko_jan_stroh","prio":"prio-3","text":"Strohballen, frische Zweige oder anderes sperriges bzw. vergängliches Material erst in den letzten 1 bis 2 Wochen lokal beschaffen; nur konkrete Mengen kaufen"},
                  {"id":"deko_jan_packen","prio":"prio-1","text":"Deko nach Aufbauzone verpacken und beschriften: Eingang, Zelt/Tische, Getränke, Questbereich, Wettkampf, Foto und Reserve; Befestigungsmaterial direkt der jeweiligen Kiste zuordnen"},
                  {"id":"deko_jan_kaufstopp","prio":"prio-2","text":"In der letzten Woche keine neue Dekolinie mehr beginnen; nur fehlende Funktions- oder Befestigungsteile ergänzen"}
              ]
          )

          phase_json = json.dumps(phases, ensure_ascii=False, separators=(",", ":"))
          text = text[:start] + phase_json + text[end:]

          text = text.replace(
              '<span class="pm">Okt–Nov</span>Bestand',
              '<span class="pm">Okt–Dez</span>Bestand'
          )

          migration_name = "ensureDecorationPlanData"

          migration = r'''
          // system_decoration_plan_migration_20260831
          async function ensureDecorationPlanData() {
            const version = "2026-08-31-deko-v1";
            try {
              const marker = await get(ref(db, dbPath("meta/decorationPlanVersion")));
              if (marker.val() === version) return;

              const now = Date.now();
              const shopping = (await get(ref(db, dbPath("shopping")))).val() || {};
              const patch = {};

              const norm = value => String(value || "").toLowerCase().replace(/\s+/g, " ").trim();
              const findShoppingKey = needles => {
                const hit = Object.entries(shopping).find(([, value]) =>
                  needles.every(needle => norm(value?.item).includes(needle))
                );
                return hit ? hit[0] : "";
              };

              const ensureShopping = (fixedKey, needles, entry) => {
                const existingKey = findShoppingKey(needles);
                if (existingKey) return existingKey;
                patch[`shopping/${fixedKey}`] = entry;
                return fixedKey;
              };

              const deadline = (taskId, due) => {
                patch[`tasks/${taskId}/due`] = due;
                patch[`tasks/${taskId}/tag`] = "Deko";
                patch[`tasks/${taskId}/updatedBy`] = "Deko-Plan 31.08.2026";
                patch[`tasks/${taskId}/updatedAt`] = now;
              };

              deadline("deko_sep_bestand", "2026-09-07");
              deadline("deko_sep_testmaterial", "2026-09-15");
              deadline("deko_sep_prototyp", "2026-09-20");
              deadline("deko_sep_mengenplan", "2026-09-30");
              deadline("deko_sep_kauffreigabe", "2026-09-30");
              deadline("deko_oct_stoff", "2026-10-31");
              deadline("deko_oct_wimpel", "2026-11-15");
              deadline("deko_oct_banner", "2026-11-15");
              deadline("deko_nov_seile", "2026-11-15");
              deadline("deko_nov_pfosten", "2026-11-30");
              deadline("deko_nov_schilder", "2026-11-30");
              deadline("deko_nov_alchemie", "2026-12-01");
              deadline("deko_nov_licht", "2026-12-01");
              deadline("deko_nov_inventur", "2026-11-30");
              deadline("deko_dec_online", "2026-12-15");

              ensureShopping(
                "system_deko_testmaterial_20260831",
                ["testmaterial", "deko"],
                {
                  item: "Deko-Testmaterial: Naturstoff + Bordeaux",
                  qty: "je ca. 1 m",
                  category: "Deko",
                  responsible: "",
                  note: "September-Prototyp. Noch keine Großbestellung. Bezugsquelle nach Preis/Verfügbarkeit: MoltonDiscount oder lokaler Stoffhandel.",
                  bought: false,
                  by: "Deko-Plan",
                  ts: now
                }
              );

              ensureShopping(
                "system_dekomolton_natur_20260831",
                ["dekomolton", "natur"],
                {
                  item: "Dekomolton Natur, ca. 300 cm breit",
                  qty: "Richtwert 6 lfm nach Aufmaß",
                  category: "Deko",
                  responsible: "",
                  note: "Hauptbeschaffung erst nach Prototyp. Bevorzugte Bezugsquelle: MoltonDiscount.",
                  bought: false,
                  by: "Deko-Plan",
                  ts: now
                }
              );

              ensureShopping(
                "system_dekomolton_weinrot_20260831",
                ["dekomolton", "weinrot"],
                {
                  item: "Dekomolton Weinrot/Bordeaux, ca. 300 cm breit",
                  qty: "Richtwert 2 lfm nach Aufmaß",
                  category: "Deko",
                  responsible: "",
                  note: "Für Akzente, Schabracken und Banner. Bevorzugte Bezugsquelle: MoltonDiscount.",
                  bought: false,
                  by: "Deko-Plan",
                  ts: now
                }
              );

              ensureShopping(
                "system_juteschnur_20260831",
                ["juteschnur"],
                {
                  item: "Juteschnur / dünnes Juteseil",
                  qty: "ca. 100 bis 150 m",
                  category: "Deko",
                  responsible: "",
                  note: "Für DIY-Wimpel, Schilder und Kleinteile. Günstig lokal bei Action prüfen.",
                  bought: false,
                  by: "Deko-Plan",
                  ts: now
                }
              );

              ensureShopping(
                "system_sisalseil_gelaende_20260831",
                ["sisalseil", "gelände"],
                {
                  item: "Sisalseil für Geländeabgrenzung",
                  qty: "ca. 50 m, etwa 6 mm",
                  category: "Gelände",
                  responsible: "",
                  note: "Nur optische Abgrenzung. Online-Großrolle meist günstiger als Baumarkt-Meterware.",
                  bought: false,
                  by: "Deko-Plan",
                  ts: now
                }
              );

              ensureShopping(
                "system_korkglaeser_alchemie_20260831",
                ["kork", "alchem"],
                {
                  item: "Kleine Korkgläser/Fläschchen für Alchemistenstation",
                  qty: "ca. 8 bis 12 Stück",
                  category: "Deko",
                  responsible: "",
                  note: "Nur gezielt ergänzen. Action zuerst prüfen; keine 20+ Flaschen nur als Füllmaterial kaufen.",
                  bought: false,
                  by: "Deko-Plan",
                  ts: now
                }
              );

              const wimpelKey = findShoppingKey(["wimpel"]);
              if (wimpelKey) {
                patch[`shopping/${wimpelKey}/item`] = "DIY-Wimpelketten aus Stoffresten";
                patch[`shopping/${wimpelKey}/qty`] = "ca. 30 bis 50 m";
                patch[`shopping/${wimpelKey}/note`] = "Nicht fertig kaufen. Aus Natur-/Bordeaux-Stoffresten und Juteschnur selbst herstellen.";
                patch[`shopping/${wimpelKey}/updatedBy`] = "Deko-Plan";
                patch[`shopping/${wimpelKey}/updatedAt`] = now;
              }

              const pfostenKey = findShoppingKey(["fichten"]);
              if (pfostenKey) {
                patch[`shopping/${pfostenKey}/qty`] = "ca. 12 bis 16 Stück nach Lageplan";
                patch[`shopping/${pfostenKey}/note`] = "Erst nach finaler Geländeabgrenzung kaufen. Einfache Fichtenlatten/Pfosten; OBI bzw. lokaler Baumarkt.";
                patch[`shopping/${pfostenKey}/updatedBy`] = "Deko-Plan";
                patch[`shopping/${pfostenKey}/updatedAt`] = now;
              }

              const strohKey = findShoppingKey(["stroh"]);
              if (strohKey) {
                patch[`shopping/${strohKey}/qty`] = "nur 1 bis 3 Stück bei konkretem Bedarf";
                patch[`shopping/${strohKey}/note`] = "Erst 1 bis 2 Wochen vor dem Event lokal beschaffen; sperrig, feuchteempfindlich und brandschutztechnisch nicht überall sinnvoll.";
                patch[`shopping/${strohKey}/updatedBy`] = "Deko-Plan";
                patch[`shopping/${strohKey}/updatedAt`] = now;
              }

              patch["meta/decorationPlanVersion"] = version;
              patch["meta/decorationPlanUpdatedAt"] = now;

              await update(ref(db, dbPath("")), patch);
              console.info("Deko-Plan-Migration angewendet:", version);
            } catch (error) {
              console.error("Deko-Plan-Migration fehlgeschlagen", error);
            }
          }

          '''

          if migration_name not in text:
              anchor = "\nfunction bindFirebase() {"
              if anchor not in text:
                  raise RuntimeError("Einfügepunkt function bindFirebase() nicht gefunden.")
              text = text.replace(anchor, "\n" + migration + anchor, 1)

          old_calls = "  ensureTentPlanData();\n            ensureFinalBudgetPlanData();\n            bindFirebase();"
          new_calls = "  await ensureTentPlanData();\n            await ensureFinalBudgetPlanData();\n            await ensureDecorationPlanData();\n            bindFirebase();"

          if old_calls in text:
              text = text.replace(old_calls, new_calls, 1)

          text = text.replace(
              'document.addEventListener("DOMContentLoaded",()=>{',
              'document.addEventListener("DOMContentLoaded",async()=>{',
              1
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Änderung prüfen
        shell: bash
        run: |
          grep -q "🎨 Deko · Test & Freigabe" index.html
          grep -q "🎨 Deko · Hauptbeschaffung & Produktion" index.html
          grep -q "ensureDecorationPlanData" index.html
          grep -q "2026-12-15" index.html
          git diff --check
          git diff --stat

      - name: Branch erstellen und Änderung committen
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine Änderung nötig."
            exit 0
          fi

          BRANCH="automation/deko-plan-${GITHUB_RUN_ID}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add index.html
          git commit -m "Deko-Aufgaben und Beschaffungsplan ergänzen"
          git push origin "$BRANCH"

      - name: Pull Request öffnen
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "Deko-Plan bis Januar ergänzen" \
            --body "Ergänzt den Winterfest-Orga-Hub um die gestaffelte Deko-Planung: September-Prototyp, Oktober bis Dezember Hauptbeschaffung und Produktion, Januar-Abschluss. Zusätzlich werden feste Deadlines und konkrete Einkaufsposten über eine einmalige Firebase-Migration angelegt."
