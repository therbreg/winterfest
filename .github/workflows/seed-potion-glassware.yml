              "potion_corks": {
                  "item": "Naturkorken als Reserve",
                  "qty": "optional",
                  "category": "Deko",
                  "responsible": "",
                  "note": "Nur falls die mitgelieferten Korken nicht ausreichen oder optisch nicht passen.",
                  "bought": False,
                  "by": "ChatGPT",
                  "ts": now
              }
          }

          def patch(path, payload):
              url = f"{base}/{path}.json"
              body = json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8")

              req = urllib.request.Request(
                  url,
                  data=body,
                  method="PATCH",
                  headers={
                      "Content-Type":
                          "application/json; charset=utf-8"
                  }
              )

              try:
                  with urllib.request.urlopen(
                      req,
                      timeout=30
                  ) as response:
                      result = response.read().decode("utf-8")
                      print(
                          f"{path}: HTTP {response.status}"
                      )
                      print(result[:500])

              except urllib.error.HTTPError as exc:
                  print(
                      f"{path}: HTTP {exc.code}"
                  )
                  print(
                      exc.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                  )
                  raise

          patch("customTasks", custom_tasks)
          patch("shopping", shopping)

          print("Fertig.")
          PY
