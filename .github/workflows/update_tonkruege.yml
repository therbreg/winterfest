name: Tonkrug-Bestand aktualisieren

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: winterfest-tonkruege-update
  cancel-in-progress: false

jobs:
  update-tonkruege:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tonkrug-Bestand aktualisieren
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          INDEX = Path("index.html")
          ASSETS = Path("ausstattung.html")

          for path in (INDEX, ASSETS):
              if not path.exists():
                  raise SystemExit(f"FEHLER: {path} fehlt")

          OLD_VERSION = 'const version = "2026-08-17-final-budget-v2";'
          NEW_VERSION = 'const version = "2026-08-19-final-budget-v3";'

          OLD_TARGET = 'patch["meta/budgetPlanTarget"] = 3718.70;'
          NEW_TARGET = 'patch["meta/budgetPlanTarget"] = 3739.70;'

          krug_pattern = re.compile(
              r'(?P<indent>^[ \t]*)'
              r'put\("kruege",\s*\{'
              r'.*?'
              r'^[ \t]*\}\);'
              r'\s*'
              r'(?=^[ \t]*put\("oa_feuerkoerbe",\s*\{)',
              re.MULTILINE | re.DOTALL
          )

          def replace_krug_block(text, path):
              matches = list(krug_pattern.finditer(text))

              if len(matches) != 1:
                  raise SystemExit(
                      f"FEHLER: kruege-Block in {path} nicht eindeutig. "
                      f"Treffer: {len(matches)}"
                  )

              def replacement(match):
                  indent = match.group("indent")

                  lines = [
                      'put("kruege", {',
                      '  planned: 43,',
                      '  actual: 43,',
                      '  status: "Gekauft",',
                      '  qty: "4 eigene Tonkrüge (3 kleinere + 1 großer)",',
                      '  next: "Eigenbestand abgeschlossen; weiteren Krugbedarf im Frühjahr 2027 über Other Ages decken",',
                      '  note: "Eigenbestand abgeschlossen: 3 Tonkrüge zusammen 21 EUR + 1 großer Tonkrug 22 EUR = 43 EUR gesamt. Weitere benötigte Krüge werden über Other Ages gemietet. Für Ausschank, Dekoration und Metkrughalten."',
                      '});',
                      ''
                  ]

                  return "\n".join(
                      indent + line if line else ""
                      for line in lines
                  )

              text, count = krug_pattern.subn(
                  replacement,
                  text,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      f"FEHLER beim Ersetzen des Krug-Blocks in {path}"
                  )

              return text


          def update_file(path):
              text = path.read_text(encoding="utf-8")

              # Wichtig:
              # Der Kommentar-Marker
              # system_final_budget_plan_20260817_v2
              # wird ABSICHTLICH nicht verändert.

              if OLD_VERSION in text:
                  text = text.replace(
                      OLD_VERSION,
                      NEW_VERSION,
                      1
                  )
                  print(f"{path}: Firebase-Migrationsversion auf v3 gesetzt")

              elif NEW_VERSION in text:
                  print(f"{path}: Firebase-Migrationsversion bereits v3")

              else:
                  raise SystemExit(
                      f"FEHLER: Budget-Migrationsversion in {path} nicht gefunden"
                  )

              text = replace_krug_block(
                  text,
                  path
              )

              if OLD_TARGET in text:
                  text = text.replace(
                      OLD_TARGET,
                      NEW_TARGET,
                      1
                  )
                  print(
                      f"{path}: Planstand "
                      "3.718,70 -> 3.739,70 EUR"
                  )

              elif NEW_TARGET in text:
                  print(
                      f"{path}: Planstand bereits 3.739,70 EUR"
                  )

              else:
                  raise SystemExit(
                      f"FEHLER: Budget-Zielwert in {path} nicht gefunden"
                  )

              return text


          # -----------------------------------------------
          # index.html
          # -----------------------------------------------

          index = update_file(INDEX)

          INDEX.write_text(
              index,
              encoding="utf-8"
          )


          # -----------------------------------------------
          # ausstattung.html
          # -----------------------------------------------

          assets = update_file(ASSETS)

          # Auch den ursprünglichen Seed-Datensatz korrigieren.
          # Das erzeugt KEINEN zweiten Posten.

          seed_pattern = re.compile(
              r'kruege:r\('
              r'"Deko",'
              r'"Gekaufte Tonkrüge"'
              r'.*?'
              r'\),'
              r'(?=\s*feuerschale:r\()',
              re.DOTALL
          )

          new_seed = (
              'kruege:r('
              '"Deko",'
              '"Gekaufte Tonkrüge",'
              '"Vorhanden",'
              '"Gekauft",'
              '"Gebrauchtkauf",'
              '"4 eigene Tonkrüge (3 kleinere + 1 großer)",'
              '43,43,'
              '"Eigenbestand abgeschlossen; weiteren Bedarf über Other Ages mieten",'
              '"3 Tonkrüge zusammen 21 EUR + 1 großer Tonkrug 22 EUR = 43 EUR. '
              'Für Ausschank, Trinkgefäße, Dekoration und Metkrughalten."'
              '),'
          )

          assets, count = seed_pattern.subn(
              new_seed,
              assets,
              count=1
          )

          if count != 1:
              if (
                  '4 eigene Tonkrüge' in assets
                  and '43,43' in assets
              ):
                  print(
                      "ausstattung.html: Seed bereits aktuell"
                  )
              else:
                  raise SystemExit(
                      "FEHLER: Tonkrug-Seed nicht gefunden"
                  )
          else:
              print(
                  "ausstattung.html: "
                  "Seed auf 4 Stück / 43 EUR gesetzt"
              )

          ASSETS.write_text(
              assets,
              encoding="utf-8"
          )


          # -----------------------------------------------
          # Sicherheitskontrollen
          # -----------------------------------------------

          index = INDEX.read_text(encoding="utf-8")
          assets = ASSETS.read_text(encoding="utf-8")

          for name, text in [
              ("index.html", index),
              ("ausstattung.html", assets)
          ]:
              start = text.find('put("kruege", {')
              end = text.find(
                  'put("oa_feuerkoerbe", {',
                  start
              )

              if start < 0 or end < 0:
                  raise SystemExit(
                      f"FEHLER: Krugbereich in {name} nicht gefunden"
                  )

              block = text[start:end]

              if "planned: 43" not in block:
                  raise SystemExit(
                      f"FEHLER: Planwert in {name} nicht 43 EUR"
                  )

              if "actual: 43" not in block:
                  raise SystemExit(
                      f"FEHLER: Istwert in {name} nicht 43 EUR"
                  )

              if "planned: 22" in block:
                  raise SystemExit(
                      f"FEHLER: alter Planwert noch in {name}"
                  )

              if "actual: 22" in block:
                  raise SystemExit(
                      f"FEHLER: alter Istwert noch in {name}"
                  )

          # Other Ages bleibt vollständig separat.

          if 'oa_weinkruege:r(' not in assets:
              raise SystemExit(
                  "FEHLER: Other-Ages-Weinkrüge fehlen"
              )

          oa_start = assets.find(
              'oa_weinkruege:r('
          )

          oa_end = assets.find(
              '\n',
              oa_start
          )

          oa_line = assets[oa_start:oa_end]

          if '"4",16,0' not in oa_line:
              raise SystemExit(
                  "FEHLER: Other-Ages-Weinkrüge wurden verändert"
              )

          print("")
          print("===================================")
          print("TONKRUG-UPDATE GEPRÜFT")
          print("===================================")
          print("Eigene Tonkrüge: 4")
          print("Eigene Tonkrüge Plan: 43 EUR")
          print("Eigene Tonkrüge Ist: 43 EUR")
          print("Other Ages: 4 Weinkrüge / 16 EUR")
          print("Gesamtplan: 3.739,70 EUR")
          print("Nettoänderung: +21,00 EUR")
          PY

      - name: Änderungen prüfen
        shell: bash
        run: |
          set -euo pipefail

          git diff --check
          git diff -- index.html ausstattung.html

      - name: Änderungen auf main veröffentlichen
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Keine Änderungen notwendig."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html ausstattung.html

          git commit \
            -m "Tonkrug-Bestand auf 4 Stück und 43 EUR aktualisieren"

          git push origin main
